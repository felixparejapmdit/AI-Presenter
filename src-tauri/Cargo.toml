[package]
name = "vanguard-deck"
version = "0.1.0"
description = "AI-powered VIP client presentation assistant with local Ollama vision models"
authors = ["felixparejapmdit"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vanguard_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP to the local daemon only, so no TLS stack is compiled in.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tokio-stream = "0.1"
sysinfo = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
sha2 = "0.10"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
